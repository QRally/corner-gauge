<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rally Recce Corner Gauge</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
--bg-dark: #0a0c10;
--panel-bg: #141820;
--panel-border: #232a38;
--accent-yellow: #ffcc00;
--accent-green: #00e676;
--accent-cyan: #00e5ff;
--accent-red: #ff3d00;
--text-main: #f0f4f8;
--text-muted: #8b9bb4;
--font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
}
body {
background-color: var(--bg-dark);
color: var(--text-main);
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
user-select: none;
}
.mono {
font-family: var(--font-mono);
}
::-webkit-scrollbar {
width: 6px;
height: 6px;
}
::-webkit-scrollbar-track {
background: #0d1117;
}
::-webkit-scrollbar-thumb {
background: #232a38;
border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
background: var(--accent-yellow);
}
input[type="range"] {
accent-color: var(--accent-yellow);
}
@media print {
body {
background: #fff !important;
color: #000 !important;
padding: 0;
}
header, .stage-card, .telemetry-card, .controls-row, .btn-group, .btn-del, .no-print {
display: none !important;
}
.container-box {
display: block !important;
}
.log-container {
border: none !important;
background: #fff !important;
color: #000 !important;
}
.log-table-wrapper {
max-height: none !important;
border: none !important;
}
th {
background: #eee !important;
color: #000 !important;
}
td {
color: #000 !important;
border-bottom: 1px solid #ccc !important;
}
}
</style>
</head>
<body class="min-h-screen p-3 md:p-5 flex flex-col items-center">
<!-- Simple Clean Header -->
<header class="w-full max-w-6xl flex justify-between items-center mb-4 pb-2 border-b border-[#232a38]">
<h1 class="text-lg md:text-xl font-bold text-[#ffcc00] uppercase tracking-wider flex items-center gap-2">
🏁 Rally Recce Corner Gauge
</h1>
</header>
<main class="container-box w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-4">
<!-- Main Video & Player Stage -->
<section class="lg:col-span-8 flex flex-col gap-3 bg-[#141820] border border-[#232a38] rounded-xl p-3 md:p-4 shadow-xl">
<div id="stage" class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-[#232a38] shadow-inner flex justify-center items-center touch-none">
<!-- Video Player Element -->
<video id="videoPlayer" class="w-full h-full object-contain pointer-events-none" playsinline webkit-playsinline preload="auto" muted></video>
<!-- Protractor Canvas Overlay -->
<canvas id="overlayCanvas" class="absolute inset-0 w-full h-full cursor-crosshair pointer-events-auto hidden"></canvas>
<!-- Initial Video Target / Dropzone Overlay -->
<label id="placeholder" for="fileInput" class="absolute inset-0 flex flex-col justify-center items-center gap-3 bg-[#0a0c10]/95 text-[#8b9bb4] text-center p-6 cursor-pointer hover:bg-[#0a0c10]/85 transition-all pointer-events-auto z-10">
<div class="text-4xl text-[#ffcc00]">📹</div>
<div class="text-base font-semibold text-white">Drop Onboard Recce Video Here</div>
<div class="text-xs text-[#8b9bb4]">Or click anywhere to choose file (MP4, WebM, MOV)</div>
</label>
</div>
<!-- Controls Row -->
<div class="flex flex-wrap items-center justify-between gap-2 bg-black/40 p-2.5 rounded-lg border border-white/5">
<div class="flex items-center gap-2 flex-wrap">
<input type="file" id="fileInput" accept="video/*" class="hidden">
<label for="fileInput" id="btnSelectFile" class="bg-[#1f2633] hover:bg-[#2b3547] text-white text-xs font-semibold px-3 py-1.5 rounded border border-[#232a38] transition flex items-center gap-1 cursor-pointer">
📂 Open File
</label>
<button id="btnUrlInput" class="bg-[#1f2633] hover:bg-[#2b3547] text-white text-xs font-semibold px-3 py-1.5 rounded border border-[#232a38] transition flex items-center gap-1">
🔗 Open URL
</button>
<button id="btnPlayPause" class="bg-[#ffcc00] hover:bg-[#e6b800] text-black text-xs font-bold px-3 py-1.5 rounded transition">
▶ Play
</button>
<button id="btnStepBack" title="Previous Frame" class="bg-[#1f2633] hover:bg-[#2b3547] text-white text-xs font-semibold px-2.5 py-1.5 rounded border border-[#232a38]">
◀ -1 Frame
</button>
<button id="btnStepFwd" title="Next Frame" class="bg-[#1f2633] hover:bg-[#2b3547] text-white text-xs font-semibold px-2.5 py-1.5 rounded border border-[#232a38]">
+1 Frame ▶
</button>
</div>
<div class="flex items-center gap-1.5">
<span class="text-xs text-[#8b9bb4] font-medium">Speed:</span>
<button class="btnSpeed text-xs bg-[#1f2633] hover:bg-[#2b3547] px-2 py-1 rounded border border-[#232a38]" data-speed="0.25">0.25x</button>
<button class="btnSpeed text-xs bg-[#ffcc00] text-black font-bold px-2 py-1 rounded border border-[#ffcc00]" data-speed="0.5">0.5x</button>
<button class="btnSpeed text-xs bg-[#1f2633] hover:bg-[#2b3547] px-2 py-1 rounded border border-[#232a38]" data-speed="1.0">1.0x</button>
</div>
</div>
<!-- Timeline Scrubber -->
<div class="flex items-center gap-3 w-full">
<input type="range" id="timeScrubber" min="0" max="100" value="0" step="0.05" class="flex-grow h-2 bg-[#232a38] rounded-lg cursor-pointer">
<span id="timeDisplay" class="mono text-sm font-bold bg-[#080a0d] text-[#00e5ff] px-2.5 py-1 rounded border border-[#232a38] min-w-[85px] text-center">
00:00.0
</span>
</div>
</section>
<!-- Angle Adjustment & Readouts -->
<section class="lg:col-span-4 flex flex-col gap-3.5 bg-[#141820] border border-[#232a38] rounded-xl p-4 shadow-xl">
<!-- Angle Adjuster Control -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label for="angleSlider" class="text-xs font-bold text-[#8b9bb4] uppercase tracking-wider">
Angle Adjustment
</label>
<div class="flex items-center gap-2">
<span id="sliderAngleBadge" class="mono text-xs text-[#ffcc00] font-bold">0.0°</span>
<button id="btnResetAngle" class="text-xs bg-[#1f2633] hover:bg-[#ff3d00] hover:text-white text-[#8b9bb4] px-2 py-0.5 rounded border border-[#232a38] transition">
Reset (0°)
</button>
</div>
</div>
<input type="range" id="angleSlider" min="-90" max="90" value="0" step="0.5" class="w-full h-2 bg-[#232a38] rounded-lg cursor-pointer">
<p class="text-[11px] text-[#8b9bb4] leading-tight">
💡 Drag target reticle on screen to set apex horizon. Drag horizontally across video or scroll wheel to rotate angle arc.
</p>
</div>
<!-- Pacenote Scale System Selector -->
<div class="flex flex-col gap-1">
<label for="systemSelect" class="text-xs font-bold text-[#8b9bb4] uppercase tracking-wider">
Pacenote Grading Scale
</label>
<select id="systemSelect" class="bg-[#080a0d] border border-[#232a38] text-white text-xs font-semibold p-2 rounded focus:outline-none focus:border-[#ffcc00]">
<option value="std16">1–6 Scale (1 Fast / 6 Tight)</option>
<option value="rev16">1–6 Scale (6 Fast / 1 Tight)</option>
<option value="scale19">1–9 Fine Scale</option>
</select>
</div>
<!-- Readouts (Clean - No Clock Face) -->
<div class="grid grid-cols-2 gap-3 bg-[#080a0d] p-3 rounded-lg border border-[#232a38] text-center">
<div class="flex flex-col">
<span class="text-[10px] uppercase font-semibold text-[#8b9bb4]">Tilt Angle</span>
<span id="readoutAngle" class="mono text-lg font-extrabold text-[#ffcc00]">0.0°</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] uppercase font-semibold text-[#8b9bb4]">Grade</span>
<span id="readoutGrade" class="mono text-lg font-extrabold text-[#00e676]">STRAIGHT</span>
</div>
</div>
<!-- Corner Modifiers -->
<div class="flex flex-col gap-1.5">
<span class="text-xs font-bold text-[#8b9bb4] uppercase tracking-wider">Modifiers</span>
<div class="grid grid-cols-2 gap-1.5">
<button class="mod-btn text-xs bg-[#1a202c] border border-[#232a38] text-[#8b9bb4] py-1.5 px-2 rounded font-medium transition" data-mod="Tightens">Tightens</button>
<button class="mod-btn text-xs bg-[#1a202c] border border-[#232a38] text-[#8b9bb4] py-1.5 px-2 rounded font-medium transition" data-mod="Opens">Opens</button>
<button class="mod-btn text-xs bg-[#1a202c] border border-[#232a38] text-[#8b9bb4] py-1.5 px-2 rounded font-medium transition" data-mod="Crest">Crest</button>
<button class="mod-btn text-xs bg-[#1a202c] border border-[#232a38] text-[#8b9bb4] py-1.5 px-2 rounded font-medium transition" data-mod="Don't Cut">Don't Cut</button>
<button class="mod-btn text-xs bg-[#1a202c] border border-[#232a38] text-[#8b9bb4] py-1.5 px-2 rounded font-medium transition" data-mod="Caution">Caution</button>
<button class="mod-btn text-xs bg-[#1a202c] border border-[#232a38] text-[#8b9bb4] py-1.5 px-2 rounded font-medium transition" data-mod="Long">Long</button>
</div>
</div>
<!-- Comment Input & Log Button -->
<div class="flex flex-col gap-2 mt-auto">
<input type="text" id="customComment" placeholder="Extra note (e.g. into 50 over bridge)..." class="w-full text-xs p-2 bg-[#080a0d] border border-[#232a38] text-white rounded focus:outline-none focus:border-[#ffcc00]">
<button id="btnLogNote" class="w-full bg-[#00e676] hover:bg-[#00c853] text-black font-extrabold text-sm py-2.5 rounded transition shadow-md flex items-center justify-center gap-1.5">
➕ Log Pacenote (Press 'L')
</button>
</div>
</section>
<!-- Pacenote Log Table -->
<section class="lg:col-span-12 log-container bg-[#141820] border border-[#232a38] rounded-xl p-4 flex flex-col gap-3 shadow-xl">
<div class="flex justify-between items-center flex-wrap gap-2">
<h2 class="text-xs font-bold text-[#8b9bb4] uppercase tracking-wider">
Pacenote Log Sheet
</h2>
<div class="flex items-center gap-2 no-print">
<button id="btnPrintSheet" class="text-xs bg-[#1f2633] hover:bg-[#2b3547] text-white font-semibold px-3 py-1.5 rounded border border-[#232a38] transition flex items-center gap-1">
🖨️ Print Sheet
</button>
<button id="btnExportCSV" class="text-xs bg-[#1f2633] hover:bg-[#2b3547] text-white font-semibold px-3 py-1.5 rounded border border-[#232a38] transition flex items-center gap-1">
📊 Export CSV
</button>
<button id="btnClearLog" class="text-xs bg-[#1f2633] hover:bg-[#ff3d00] text-[#ff3d00] hover:text-white font-semibold px-3 py-1.5 rounded border border-[#232a38] transition">
🗑️ Clear Log
</button>
</div>
</div>
<div class="log-table-wrapper max-h-60 overflow-y-auto rounded-lg border border-[#232a38] bg-[#080a0d]">
<table class="w-full text-left mono text-xs">
<thead class="sticky top-0 bg-[#10141d] text-[#ffcc00] border-b border-[#232a38]">
<tr>
<th class="p-2.5 w-24">Time</th>
<th class="p-2.5 w-20">Angle</th>
<th class="p-2.5 w-28">Grade</th>
<th class="p-2.5">Modifiers & Description</th>
<th class="p-2.5 w-12 text-center no-print"></th>
</tr>
</thead>
<tbody id="logTableBody">
<!-- Dynamic logged pacenotes -->
</tbody>
</table>
</div>
</section>
</main>
<!-- Toast Banner -->
<div id="toast" class="fixed bottom-5 right-5 bg-[#ffcc00] text-black px-4 py-2.5 rounded-lg font-bold shadow-2xl translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
Log entry saved!
</div>
<script>
const video = document.getElementById('videoPlayer');
const canvas = document.getElementById('overlayCanvas');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const fileInput = document.getElementById('fileInput');
const placeholder = document.getElementById('placeholder');
const btnUrlInput = document.getElementById('btnUrlInput');
const btnPlayPause = document.getElementById('btnPlayPause');
const btnStepBack = document.getElementById('btnStepBack');
const btnStepFwd = document.getElementById('btnStepFwd');
const speedButtons = document.querySelectorAll('.btnSpeed');
const timeScrubber = document.getElementById('timeScrubber');
const timeDisplay = document.getElementById('timeDisplay');
const angleSlider = document.getElementById('angleSlider');
const sliderAngleBadge = document.getElementById('sliderAngleBadge');
const btnResetAngle = document.getElementById('btnResetAngle');
const systemSelect = document.getElementById('systemSelect');
const modButtons = document.querySelectorAll('.mod-btn');
const customComment = document.getElementById('customComment');
const readoutAngle = document.getElementById('readoutAngle');
const readoutGrade = document.getElementById('readoutGrade');
const btnLogNote = document.getElementById('btnLogNote');
const btnExportCSV = document.getElementById('btnExportCSV');
const btnPrintSheet = document.getElementById('btnPrintSheet');
const btnClearLog = document.getElementById('btnClearLog');
const logTableBody = document.getElementById('logTableBody');
const toast = document.getElementById('toast');
// State variables
let currentAngle = 0;
let activeSystem = 'std16';
let activeModifiers = [];
let logData = [];
let selectedSpeed = 0.5;
let currentVideoBlobUrl = null;
let animFrameId = null;
// Apex Pivot point ratios
let originXRatio = 0.5;
let originYRatio = 0.72;
let isDraggingOrigin = false;
let isRotating = false;
let dragStartX = 0;
function resizeCanvas() {
if (!stage) return;
canvas.width = stage.clientWidth;
canvas.height = stage.clientHeight;
drawOverlay();
}
window.addEventListener('resize', resizeCanvas);
// Reset input value on click to allow re-selecting the same video file
fileInput.addEventListener('click', () => {
fileInput.value = '';
});
fileInput.addEventListener('change', (e) => {
const file = e.target.files[0];
if (file) {
loadVideoFile(file);
}
});
function loadVideoFile(file) {
if (currentVideoBlobUrl) {
URL.revokeObjectURL(currentVideoBlobUrl);
}
currentVideoBlobUrl = URL.createObjectURL(file);
loadVideoSource(currentVideoBlobUrl);
}
btnUrlInput.addEventListener('click', () => {
const url = prompt('Enter video file URL (MP4 / WebM):');
if (url && url.trim() !== '') {
loadVideoSource(url.trim());
}
});
function loadVideoSource(src) {
video.pause();
btnPlayPause.textContent = '▶ Play';
video.src = src;
placeholder.style.display = 'none';
canvas.classList.remove('hidden');
video.load();
showToast('Loading video...');
}
video.addEventListener('canplay', () => {
resizeCanvas();
if (video.duration && !isNaN(video.duration)) {
timeScrubber.max = video.duration;
}
video.playbackRate = selectedSpeed;
drawOverlay();
});
video.addEventListener('loadedmetadata', () => {
resizeCanvas();
if (video.duration && !isNaN(video.duration)) {
timeScrubber.max = video.duration;
}
video.playbackRate = selectedSpeed;
drawOverlay();
});
video.addEventListener('error', () => {
showToast('⚠️ Error loading video. Format or codec unsupported.');
placeholder.style.display = 'flex';
canvas.classList.add('hidden');
});
// Drag and drop onto stage
stage.addEventListener('dragover', (e) => {
e.preventDefault();
});
stage.addEventListener('drop', (e) => {
e.preventDefault();
if (e.dataTransfer.files && e.dataTransfer.files[0]) {
loadVideoFile(e.dataTransfer.files[0]);
}
});
function updateVideoLoop() {
if (!video.paused && !video.ended) {
if (!timeScrubber.matches(':active')) {
timeScrubber.value = video.currentTime;
}
formatTime(video.currentTime);
drawOverlay();
animFrameId = requestAnimationFrame(updateVideoLoop);
}
}
video.addEventListener('play', () => {
btnPlayPause.textContent = '⏸ Pause';
animFrameId = requestAnimationFrame(updateVideoLoop);
});
video.addEventListener('pause', () => {
btnPlayPause.textContent = '▶ Play';
if (animFrameId) cancelAnimationFrame(animFrameId);
formatTime(video.currentTime);
drawOverlay();
});
video.addEventListener('timeupdate', () => {
if (video.paused) {
if (!timeScrubber.matches(':active')) {
timeScrubber.value = video.currentTime;
}
formatTime(video.currentTime);
drawOverlay();
}
});
function formatTime(seconds) {
if (isNaN(seconds)) seconds = 0;
const mins = Math.floor(seconds / 60);
const secs = Math.floor(seconds % 60);
const ms = Math.floor((seconds % 1) * 10);
const formatted = ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms};
timeDisplay.textContent = formatted;
return formatted;
}
function togglePlay() {
if (!video.src) {
fileInput.click();
return;
}
if (video.paused) {
video.playbackRate = selectedSpeed;
video.play().catch(err => {
showToast('Click play to start video');
});
} else {
video.pause();
}
}
btnPlayPause.addEventListener('click', togglePlay);
btnStepBack.addEventListener('click', () => {
if (!video.src) return;
video.pause();
video.currentTime = Math.max(0, video.currentTime - (1 / 30));
});
btnStepFwd.addEventListener('click', () => {
if (!video.src) return;
video.pause();
video.currentTime = Math.min(video.duration || 100, video.currentTime + (1 / 30));
});
speedButtons.forEach(btn => {
btn.addEventListener('click', () => {
speedButtons.forEach(b => {
b.classList.remove('bg-[#ffcc00]', 'text-black', 'font-bold');
b.classList.add('bg-[#1f2633]', 'text-white');
});
btn.classList.remove('bg-[#1f2633]', 'text-white');
btn.classList.add('bg-[#ffcc00]', 'text-black', 'font-bold');
selectedSpeed = parseFloat(btn.dataset.speed);
video.playbackRate = selectedSpeed;
});
});
timeScrubber.addEventListener('input', () => {
if (!video.src) return;
video.currentTime = timeScrubber.value;
formatTime(video.currentTime);
drawOverlay();
});
function setAngle(angleVal) {
currentAngle = Math.max(-90, Math.min(90, parseFloat(angleVal)));
angleSlider.value = currentAngle;
sliderAngleBadge.textContent = ${currentAngle > 0 ? '+' : ''}${currentAngle.toFixed(1)}°;
updateReadouts();
drawOverlay();
}
angleSlider.addEventListener('input', (e) => {
setAngle(e.target.value);
});
btnResetAngle.addEventListener('click', () => {
setAngle(0);
});
systemSelect.addEventListener('change', (e) => {
activeSystem = e.target.value;
updateReadouts();
drawOverlay();
});
modButtons.forEach(btn => {
btn.addEventListener('click', () => {
const mod = btn.dataset.mod;
if (activeModifiers.includes(mod)) {
activeModifiers = activeModifiers.filter(m => m !== mod);
btn.classList.remove('bg-[#ffcc00]', 'text-black', 'border-[#ffcc00]');
btn.classList.add('bg-[#1a202c]', 'text-[#8b9bb4]', 'border-[#232a38]');
} else {
activeModifiers.push(mod);
btn.classList.remove('bg-[#1a202c]', 'text-[#8b9bb4]', 'border-[#232a38]');
btn.classList.add('bg-[#ffcc00]', 'text-black', 'border-[#ffcc00]');
}
});
});
// Corner Grade Calculation (Clean Standard 1-6 / 1-9)
function calculateGrade(angle, system) {
const absAngle = Math.abs(angle);
const dir = angle > 0 ? 'R' : (angle < 0 ? 'L' : '');
if (absAngle < 3) return 'STRAIGHT';
if (system === 'std16') {
// 1 Fast / 6 Tight
if (absAngle < 15) return ${dir}1;
if (absAngle < 30) return ${dir}2;
if (absAngle < 45) return ${dir}3;
if (absAngle < 60) return ${dir}4;
if (absAngle < 75) return ${dir}5;
return ${dir}6;
} else if (system === 'rev16') {
// 6 Fast / 1 Tight
if (absAngle < 15) return ${dir}6;
if (absAngle < 30) return ${dir}5;
if (absAngle < 45) return ${dir}4;
if (absAngle < 60) return ${dir}3;
if (absAngle < 75) return ${dir}2;
return ${dir}1;
} else if (system === 'scale19') {
const val = Math.min(9, Math.ceil(absAngle / 10));
return ${dir}${val};
}
return 'STRAIGHT';
}
function updateReadouts() {
readoutAngle.textContent = ${currentAngle > 0 ? '+' : ''}${currentAngle.toFixed(1)}°;
readoutGrade.textContent = calculateGrade(currentAngle, activeSystem);
}
// High-Contrast Overlay HUD Renderer
function drawOverlay() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
const originX = canvas.width * originXRatio;
const originY = canvas.height * originYRatio;
const radius = Math.min(canvas.width, canvas.height) * 0.35;
// Alignment Crosshair - Subtle semi-transparent stroke
ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
ctx.lineWidth = 1;
ctx.setLineDash([4, 4]);
ctx.beginPath();
ctx.moveTo(0, originY);
ctx.lineTo(canvas.width, originY);
ctx.moveTo(originX, 0);
ctx.lineTo(originX, canvas.height);
ctx.stroke();
ctx.setLineDash([]);
// Outer Arc Baseline
ctx.beginPath();
ctx.arc(originX, originY, radius, -Math.PI, 0, false);
ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
ctx.lineWidth = 5;
ctx.stroke();
ctx.strokeStyle = 'rgba(255, 255, 255
