<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rally Recce Corner Gauge</title>
    <!-- Tailwind CDN with fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: #141820;
            --panel-border: #232a38;
            --accent-yellow: #ffcc00;
            --accent-green: #00e676;
            --accent-cyan: #00e5ff;
            --accent-red: #ff3d00;
            --text-main: #f0f4f8;
            --text-muted: #8b9bb4;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            line-height: 1.4;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .mono {
            font-family: var(--font-mono);
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            width: 100%;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stage-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn {
            background-color: #1f2633;
            color: #fff;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        .btn:hover, .btn:active {
            background-color: #2b3547;
        }

        .btn-primary {
            background-color: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
            font-weight: 800;
        }

        .btn-primary:hover, .btn-primary:active {
            background-color: #e6b800;
            color: #000;
        }

        .btn-success {
            background-color: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            font-weight: 800;
        }

        .btn-success:hover, .btn-success:active {
            background-color: #00d669;
            color: #000;
        }

        .btn-danger {
            background-color: rgba(255, 61, 0, 0.2);
            color: var(--accent-red);
            border-color: rgba(255, 61, 0, 0.4);
        }

        .btn-danger:hover {
            background-color: var(--accent-red);
            color: #fff;
        }

        input[type="range"] {
            accent-color: var(--accent-yellow);
            width: 100%;
            height: 6px;
            background: #232a38;
            border-radius: 4px;
        }

        select, input[type="text"] {
            background-color: #080a0d;
            border: 1px solid var(--panel-border);
            color: #fff;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-yellow);
        }

        .grid-mods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .mod-btn {
            background: #1a202c;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .mod-btn.active {
            background-color: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 12px;
            text-align: left;
        }

        .log-table th {
            background-color: #10141d;
            color: var(--accent-yellow);
            padding: 10px;
            border-bottom: 1px solid var(--panel-border);
            position: sticky;
            top: 0;
        }

        .log-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #1a202c;
            color: var(--text-main);
        }

        .log-table tr:hover {
            background-color: #1a202c;
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #232a38;
            border-radius: 3px;
        }

        .visually-hidden-input {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
            opacity: 0 !important;
        }

        @media print {
            body { background: #fff !important; color: #000 !important; }
            header, .stage-box, .controls-bar, .angle-section, .modifiers-section, .no-print { display: none !important; }
            .card { border: none !important; box-shadow: none !important; background: #fff !important; }
            .log-table th { background: #ddd !important; color: #000 !important; }
            .log-table td { color: #000 !important; border-bottom: 1px solid #ccc !important; }
            .log-section { padding: 0 !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1 class="text-base md:text-xl font-bold uppercase tracking-wider flex items-center gap-2 text-[#ffcc00]">
                🏁 Rally Recce Corner Gauge
            </h1>
            <span class="text-xs text-[#8b9bb4] mono">v2.3</span>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            <!-- VIDEO & HUD STAGE CARD -->
            <section class="lg:col-span-8 card">
                
                <div id="stage" class="stage-box">
                    <video id="videoPlayer" class="w-full h-full object-contain pointer-events-none" playsinline webkit-playsinline preload="auto" muted></video>
                    <canvas id="overlayCanvas" class="absolute inset-0 w-full h-full cursor-crosshair pointer-events-auto hidden"></canvas>
                    
                    <div id="placeholder" class="absolute inset-0 flex flex-col justify-center items-center p-2 sm:p-4 bg-[#0a0c10]/95 text-center gap-1.5 sm:gap-2 z-10 overflow-hidden">
                        <div class="text-2xl sm:text-3xl text-[#ffcc00]">📹</div>
                        <div class="text-xs sm:text-sm font-bold text-white">Choose Your Recce Video</div>
                        <div class="text-[10px] sm:text-xs text-[#8b9bb4] max-w-xs leading-tight">Supports MP4, WebM, or MOV</div>
                        
                        <div class="flex flex-wrap justify-center gap-2 mt-1">
                            <button id="btnChooseLocal" class="btn btn-primary text-[11px] sm:text-xs py-1.5 px-3">
                                📁 Open Video
                            </button>
                        </div>
                    </div>

                    <input type="file" id="fileInput" accept="video/mp4,video/webm,video/quicktime,video/*" class="visually-hidden-input">
                </div>

                <!-- Control Buttons Bar -->
                <div class="controls-bar flex flex-wrap items-center justify-between gap-2 p-2 bg-black/40 rounded-lg border border-white/5">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <button id="btnOpen" class="btn text-xs py-1.5 px-2.5">📂 Open</button>
                        <button id="btnPlayPause" class="btn btn-primary text-xs py-1.5 px-3">▶ Play</button>
                        <button id="btnStepBack" title="Step -1 frame" class="btn text-xs py-1.5 px-2">◀ -1f</button>
                        <button id="btnStepFwd" title="Step +1 frame" class="btn text-xs py-1.5 px-2">+1f ▶</button>
                    </div>

                    <div class="flex items-center gap-1">
                        <span class="text-[11px] text-[#8b9bb4]">Speed:</span>
                        <button class="btnSpeed btn text-[11px] px-2 py-1" data-speed="0.25">0.25x</button>
                        <button class="btnSpeed btn btn-primary text-[11px] px-2 py-1" data-speed="0.5">0.5x</button>
                        <button class="btnSpeed btn text-[11px] px-2 py-1" data-speed="1.0">1.0x</button>
                    </div>
                </div>

                <!-- Timeline Scrubber -->
                <div class="flex items-center gap-2 w-full">
                    <input type="range" id="timeScrubber" min="0" max="100" value="0" step="0.05" class="flex-grow">
                    <span id="timeDisplay" class="mono text-xs font-bold bg-[#080a0d] text-[#00e5ff] px-2 py-1 rounded border border-[#232a38] min-w-[70px] text-center">
                        00:00.0
                    </span>
                </div>
            </section>

            <!-- ANGLE ADJUSTER & READOUTS PANEL -->
            <section class="lg:col-span-4 card angle-section">
                
                <div class="flex flex-col gap-1.5">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-[#8b9bb4] uppercase tracking-wider">Angle</label>
                        <div class="flex items-center gap-2">
                            <span id="sliderAngleBadge" class="mono text-xs text-[#ffcc00] font-bold">0.0°</span>
                            <button id="btnResetAngle" class="btn text-[10px] py-0.5 px-1.5">Reset</button>
                        </div>
                    </div>
                    <input type="range" id="angleSlider" min="-90" max="90" value="0" step="0.5">
                </div>

                <div class="flex flex-col gap-1">
                    <label for="systemSelect" class="text-xs font-bold text-[#8b9bb4] uppercase tracking-wider">Scale</label>
                    <select id="systemSelect">
                        <option value="rev16" selected>1–6 (6 Fast / 1 Tight)</option>
                        <option value="std16">1–6 (1 Fast / 6 Tight)</option>
                        <option value="scale19">1–9 Fine</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2 bg-[#080a0d] p-2.5 rounded-lg border border-[#232a38] text-center">
                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase font-semibold text-[#8b9bb4]">Angle</span>
                        <span id="readoutAngle" class="mono text-base font-extrabold text-[#ffcc00]">0.0°</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase font-semibold text-[#8b9bb4]">Grade</span>
                        <span id="readoutGrade" class="mono text-base font-extrabold text-[#00e676]">STRAIGHT</span>
                    </div>
                </div>

                <div class="flex flex-col gap-1.5 modifiers-section">
                    <span class="text-xs font-bold text-[#8b9bb4] uppercase tracking-wider">Modifiers</span>
                    <div class="grid-mods">
                        <button class="mod-btn" data-mod="Tightens">Tightens</button>
                        <button class="mod-btn" data-mod="Opens">Opens</button>
                        <button class="mod-btn" data-mod="Crest">Crest</button>
                        <button class="mod-btn" data-mod="Don't Cut">Don't Cut</button>
                        <button class="mod-btn" data-mod="Caution">Caution</button>
                        <button class="mod-btn" data-mod="Long">Long</button>
                    </div>
                </div>

                <div class="flex flex-col gap-2 mt-auto">
                    <input type="text" id="customComment" placeholder="Add detail...">
                    <button id="btnLogNote" class="btn btn-success w-full py-2.5 text-sm">
                        ➕ Log Note
                    </button>
                </div>
            </section>

            <!-- PACENOTE LOG SHEET -->
            <section class="lg:col-span-12 card log-section">
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <h2 class="text-xs font-bold text-[#8b9bb4] uppercase tracking-wider">Pacenotes</h2>
                    <div class="flex items-center gap-1.5 no-print">
                        <button id="btnExportCSV" class="btn text-xs py-1 px-2.5">📊 CSV</button>
                        <button id="btnClearLog" class="btn btn-danger text-xs py-1 px-2.5">🗑️ Clear</button>
                    </div>
                </div>

                <div class="max-h-56 overflow-y-auto rounded-lg border border-[#232a38] bg-[#080a0d]">
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th style="width: 20%;">Time</th>
                                <th style="width: 18%;">Angle</th>
                                <th style="width: 22%;">Grade</th>
                                <th>Notes</th>
                                <th style="width: 10%; text-align: center;" class="no-print"></th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- TOAST BANNER -->
    <div id="toast" class="fixed bottom-5 right-5 bg-[#ffcc00] text-black font-extrabold px-4 py-2 rounded-lg shadow-2xl transition-all duration-300 translate-y-20 opacity-0 z-50 pointer-events-none">
        Notification
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stage');
        const placeholder = document.getElementById('placeholder');
        const fileInput = document.getElementById('fileInput');
        
        const btnChooseLocal = document.getElementById('btnChooseLocal');
        const btnOpen = document.getElementById('btnOpen');

        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnStepBack = document.getElementById('btnStepBack');
        const btnStepFwd = document.getElementById('btnStepFwd');
        const speedButtons = document.querySelectorAll('.btnSpeed');
        const timeScrubber = document.getElementById('timeScrubber');
        const timeDisplay = document.getElementById('timeDisplay');
        
        const angleSlider = document.getElementById('angleSlider');
        const sliderAngleBadge = document.getElementById('sliderAngleBadge');
        const btnResetAngle = document.getElementById('btnResetAngle');
        const systemSelect = document.getElementById('systemSelect');
        const modButtons = document.querySelectorAll('.mod-btn');
        const customComment = document.getElementById('customComment');
        
        const readoutAngle = document.getElementById('readoutAngle');
        const readoutGrade = document.getElementById('readoutGrade');

        const btnLogNote = document.getElementById('btnLogNote');
        const btnExportCSV = document.getElementById('btnExportCSV');
        const btnClearLog = document.getElementById('btnClearLog');
        const logTableBody = document.getElementById('logTableBody');
        const toast = document.getElementById('toast');

        let currentAngle = 0;
        let activeSystem = systemSelect.value || 'rev16';
        let activeModifiers = [];
        let logData = [];
        let selectedSpeed = 0.5;
        let currentVideoBlobUrl = null;
        let animFrameId = null;

        let originXRatio = 0.5;
        let originYRatio = 0.72;

        let isDraggingOrigin = false;
        let isRotating = false;
        let dragStartX = 0;

        function resizeCanvas() {
            if (!stage) return;
            canvas.width = stage.clientWidth;
            canvas.height = stage.clientHeight;
            drawOverlay();
        }

        window.addEventListener('resize', resizeCanvas);

        function triggerFileInput() {
            fileInput.click();
        }

        btnChooseLocal.addEventListener('click', triggerFileInput);
        btnOpen.addEventListener('click', triggerFileInput);

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (currentVideoBlobUrl) {
                    URL.revokeObjectURL(currentVideoBlobUrl);
                }
                currentVideoBlobUrl = URL.createObjectURL(file);
                loadVideoSource(currentVideoBlobUrl);
            }
        });

        function loadVideoSource(src) {
            showToast('Loading video...');
            video.pause();
            btnPlayPause.textContent = '▶ Play';
            
            video.src = src;
            placeholder.style.display = 'none';
            canvas.classList.remove('hidden');
            
            video.load();
        }

        ['loadedmetadata', 'loadeddata', 'canplay'].forEach(evt => {
            video.addEventListener(evt, () => {
                resizeCanvas();
                if (video.duration && !isNaN(video.duration)) {
                    timeScrubber.max = video.duration;
                }
                video.playbackRate = selectedSpeed;
                drawOverlay();
            });
        });

        video.addEventListener('error', () => {
            showToast('⚠️ Video format not supported');
        });

        function renderLoop() {
            if (!video.paused && !video.ended) {
                if (!timeScrubber.matches(':active')) {
                    timeScrubber.value = video.currentTime;
                }
                formatTime(video.currentTime);
                drawOverlay();
                animFrameId = requestAnimationFrame(renderLoop);
            }
        }

        video.addEventListener('play', () => {
            btnPlayPause.textContent = '⏸ Pause';
            animFrameId = requestAnimationFrame(renderLoop);
        });

        video.addEventListener('pause', () => {
            btnPlayPause.textContent = '▶ Play';
            if (animFrameId) cancelAnimationFrame(animFrameId);
            formatTime(video.currentTime);
            drawOverlay();
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) seconds = 0;
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 10);
            const formatted = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms}`;
            timeDisplay.textContent = formatted;
            return formatted;
        }

        function togglePlay() {
            if (!video.src) {
                triggerFileInput();
                return;
            }
            if (video.paused) {
                video.playbackRate = selectedSpeed;
                video.play().catch(() => showToast('Tap play button'));
            } else {
                video.pause();
            }
        }

        btnPlayPause.addEventListener('click', togglePlay);

        btnStepBack.addEventListener('click', () => {
            if (!video.src) return;
            video.pause();
            video.currentTime = Math.max(0, video.currentTime - (1 / 30));
        });

        btnStepFwd.addEventListener('click', () => {
            if (!video.src) return;
            video.pause();
            video.currentTime = Math.min(video.duration || 100, video.currentTime + (1 / 30));
        });

        speedButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                speedButtons.forEach(b => b.classList.remove('btn-primary'));
                btn.classList.add('btn-primary');
                selectedSpeed = parseFloat(btn.dataset.speed);
                video.playbackRate = selectedSpeed;
            });
        });

        timeScrubber.addEventListener('input', () => {
            if (!video.src) return;
            video.currentTime = timeScrubber.value;
            formatTime(video.currentTime);
            drawOverlay();
        });

        function setAngle(angleVal) {
            currentAngle = Math.max(-90, Math.min(90, parseFloat(angleVal)));
            angleSlider.value = currentAngle;
            sliderAngleBadge.textContent = `${currentAngle > 0 ? '+' : ''}${currentAngle.toFixed(1)}°`;
            updateReadouts();
            drawOverlay();
        }

        angleSlider.addEventListener('input', (e) => setAngle(e.target.value));
        btnResetAngle.addEventListener('click', () => setAngle(0));
        systemSelect.addEventListener('change', (e) => {
            activeSystem = e.target.value;
            updateReadouts();
            drawOverlay();
        });

        modButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const mod = btn.dataset.mod;
                if (activeModifiers.includes(mod)) {
                    activeModifiers = activeModifiers.filter(m => m !== mod);
                    btn.classList.remove('active');
                } else {
                    activeModifiers.push(mod);
                    btn.classList.add('active');
                }
            });
        });

        function calculateGrade(angle, system) {
            const absAngle = Math.abs(angle);
            const dir = angle > 0 ? 'R' : (angle < 0 ? 'L' : '');
            
            if (absAngle < 3) return 'STRAIGHT';

            if (system === 'rev16') {
                if (absAngle < 15) return `${dir}6`;
                if (absAngle < 30) return `${dir}5`;
                if (absAngle < 45) return `${dir}4`;
                if (absAngle < 60) return `${dir}3`;
                if (absAngle < 75) return `${dir}2`;
                return `${dir}1`;
            } else if (system === 'std16') {
                if (absAngle < 15) return `${dir}1`;
                if (absAngle < 30) return `${dir}2`;
                if (absAngle < 45) return `${dir}3`;
                if (absAngle < 60) return `${dir}4`;
                if (absAngle < 75) return `${dir}5`;
                return `${dir}6`;
            } else if (system === 'scale19') {
                const val = Math.min(9, Math.ceil(absAngle / 10));
                return `${dir}${val}`;
            }
            return 'STRAIGHT';
        }

        function updateReadouts() {
            readoutAngle.textContent = `${currentAngle > 0 ? '+' : ''}${currentAngle.toFixed(1)}°`;
            readoutGrade.textContent = calculateGrade(currentAngle, activeSystem);
        }

        function drawOverlay() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const originX = canvas.width * originXRatio;
            const originY = canvas.height * originYRatio;
            const radius = Math.min(canvas.width, canvas.height) * 0.35;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(originX, originY, radius, -Math.PI, 0, false);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            const radAngle = (currentAngle - 90) * (Math.PI / 180);
            const zeroRad = -Math.PI / 2;

            const absA = Math.abs(currentAngle);
            let strokeColor = '#00e676';
            if (absA > 25) strokeColor = '#ffcc00';
            if (absA > 50) strokeColor = '#ff9100';
            if (absA > 70) strokeColor = '#ff3d00';

            ctx.beginPath();
            if (currentAngle >= 0) {
                ctx.arc(originX, originY, radius, zeroRad, radAngle, false);
            } else {
                ctx.arc(originX, originY, radius, radAngle, zeroRad, false);
            }
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.5;
            ctx.stroke();

            for (let deg = -90; deg <= 90; deg += 15) {
                const tickRad = (deg - 90) * (Math.PI / 180);
                const x1 = originX + Math.cos(tickRad) * (radius - 8);
                const y1 = originY + Math.sin(tickRad) * (radius - 8);
                const x2 = originX + Math.cos(tickRad) * (radius + 8);
                const y2 = originY + Math.sin(tickRad) * (radius + 8);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = deg === 0 ? 4 : 2;
                ctx.stroke();

                ctx.strokeStyle = deg === 0 ? '#ffcc00' : 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = deg === 0 ? 2 : 1;
                ctx.stroke();
            }

            const pointerX = originX + Math.cos(radAngle) * (radius + 16);
            const pointerY = originY + Math.sin(radAngle) * (radius + 16);

            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(pointerX, pointerY);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(pointerX, pointerY);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(originX, originY, 7, 0, Math.PI * 2);
            ctx.fillStyle = isDraggingOrigin ? '#ffcc00' : '#00e5ff';
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();

            const gradeText = calculateGrade(currentAngle, activeSystem);
            const labelStr = `${gradeText} (${currentAngle > 0 ? '+' : ''}${currentAngle.toFixed(1)}°)`;
            
            ctx.font = 'bold 15px sans-serif';
            ctx.textAlign = 'center';
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.lineWidth = 4;
            ctx.strokeText(labelStr, originX, Math.max(25, originY - radius - 18));
            ctx.fillStyle = strokeColor;
            ctx.fillText(labelStr, originX, Math.max(25, originY - radius - 18));
        }

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const pivotX = canvas.width * originXRatio;
            const pivotY = canvas.height * originYRatio;

            const dist = Math.hypot(clickX - pivotX, clickY - pivotY);
            if (dist < 35) {
                isDraggingOrigin = true;
            } else {
                isRotating = true;
                dragStartX = e.clientX;
            }
            try { canvas.setPointerCapture(e.pointerId); } catch(err){}
        });

        canvas.addEventListener('pointermove', (e) => {
            const rect = canvas.getBoundingClientRect();
            if (isDraggingOrigin) {
                originXRatio = Math.max(0.1, Math.min(0.9, (e.clientX - rect.left) / canvas.width));
                originYRatio = Math.max(0.1, Math.min(0.9, (e.clientY - rect.top) / canvas.height));
                drawOverlay();
            } else if (isRotating) {
                const deltaX = e.clientX - dragStartX;
                dragStartX = e.clientX;
                setAngle(currentAngle + deltaX * 0.5);
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            isDraggingOrigin = false;
            isRotating = false;
            try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 1 : -1;
            setAngle(currentAngle + delta);
        }, { passive: false });

        function logCurrentNote() {
            const timeFormatted = timeDisplay.textContent;
            const rawTime = video.currentTime || 0;
            const grade = calculateGrade(currentAngle, activeSystem);
            const noteMods = [...activeModifiers];
            
            if (customComment.value.trim() !== '') {
                noteMods.push(customComment.value.trim());
            }

            const item = {
                id: Date.now(),
                timestamp: rawTime,
                timeStr: timeFormatted,
                angle: currentAngle.toFixed(1),
                grade: grade,
                modifiers: noteMods.join(', ') || '-'
            };

            logData.push(item);
            renderLogTable();
            showToast(`Logged: ${grade}`);
            customComment.value = '';
            
            // Clear all modifier buttons
            modButtons.forEach(btn => btn.classList.remove('active'));
            activeModifiers = [];
        }

        function renderLogTable() {
            logTableBody.innerHTML = '';
            if (logData.length === 0) {
                logTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#8b9bb4; padding:12px;">No notes logged</td></tr>`;
                return;
            }

            logData.forEach((item) => {
                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td class="mono font-bold">${item.timeStr}</td>
                    <td>${item.angle}°</td>
                    <td><strong style="color:var(--accent-yellow)">${item.grade}</strong></td>
                    <td>${item.modifiers}</td>
                    <td style="text-align:center;" class="no-print">
                        <button class="btn btn-danger btn-del" data-id="${item.id}" style="padding:2px 6px;">✕</button>
                    </td>
                `;

                tr.addEventListener('click', (e) => {
                    if (e.target.classList.contains('btn-del')) return;
                    if (video.src) {
                        video.currentTime = item.timestamp;
                        showToast(`Jumped to ${item.timeStr}`);
                    }
                });

                logTableBody.appendChild(tr);
            });

            document.querySelectorAll('.btn-del').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    logData = logData.filter(i => i.id !== id);
                    renderLogTable();
                });
            });
        }

        btnLogNote.addEventListener('click', logCurrentNote);

        btnClearLog.addEventListener('click', () => {
            logData = [];
            renderLogTable();
            showToast('Log cleared');
        });

        btnExportCSV.addEventListener('click', () => {
            if (logData.length === 0) {
                showToast('Log is empty');
                return;
            }
            let csv = 'Time,Angle,Grade,Notes\n';
            logData.forEach(i => {
                csv += `"${i.timeStr}","${i.angle}","${i.grade}","${i.modifiers.replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pacenotes_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('CSV Exported');
        });

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2200);
        }

        setAngle(0);
        renderLogTable();
    </script>
</body>
</html>
